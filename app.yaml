command:
  - "python"
  - "-m"
  - "uvicorn"
  - "app:app"
  - "--host"
  - "0.0.0.0"
  - "--port"
  - "8000"

env:
  - name: PGHOST
    value: 'HOST_HERE'
  - name: PGPORT
    value: '5432'
  - name: PGDATABASE
    value: 'cruds_db'
  - name: PGUSER
    value: 'USER_HERE'
  - name: PGPASSWORD
    value: 'PASSWORD_HERE'
  - name: PGSSLMODE
    value: 'require'
  - name: SERVING_ENDPOINT
    value: 'databricks-llama-4-maverick'

resources:
  - name: serving-endpoint
    serving_endpoint:
      name: databricks-llama-4-maverick
      permission: CAN_QUERY
